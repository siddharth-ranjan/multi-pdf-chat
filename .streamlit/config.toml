[server]
# Largest single PDF accepted, in MB. The app also caps the total upload.
maxUploadSize = 10
# Seconds a disconnected session is kept before Streamlit discards it.
disconnectedSessionTTL = 60
# Serves ./static at /app/static (the link-preview image)
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#F7F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2937"
font = "sans serif"
